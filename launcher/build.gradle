plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.plugin.serialization"
    id 'application'
}

dependencies {
    api project(":tasks_bot.common.bot")
    api project(":tasks_bot.teachers.bot")
    api project(":tasks_bot.courses.bot")
    api project(":tasks_bot.tasks.bot")
    api project(":tasks_bot.tasks.webapp")
    api project(":tasks_bot.users.bot")
    api project(":tasks_bot.webapp.server")
    api project(":tasks_bot.webapp.bot")
    api project(":tasks_bot.webapp.client")

    api libs.plagubot.bot
    api libs.psql
}

application {
    mainClass = 'dev.inmo.plagubot.AppKt'
}

// Compose 1.12 forwards these desktop runtimes to AndroidX with metadata-only JARs.
def composeRuntimeForwarders = configurations.runtimeClasspath.incoming.artifactView {
    componentFilter { id ->
        id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
            id.group == "org.jetbrains.compose.runtime" &&
            id.module in ["runtime-desktop", "runtime-saveable-desktop"]
    }
}.files

distributions.main.contents.eachFile { details ->
    if (composeRuntimeForwarders.contains(details.file)) {
        if (!zipTree(details.file).matching { include "**/*.class" }.isEmpty()) {
            throw new GradleException("Expected a metadata-only Compose runtime forwarder: ${details.file.name}")
        }
        details.name = "org.jetbrains.compose.runtime-${details.name}"
    }
}

tasks.named("startScripts") {
    classpath = classpath.minus(composeRuntimeForwarders)
}
